<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <linearGradient id="bg-betting" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E30"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#080D1A"/>
    </linearGradient>
    <linearGradient id="gold-btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow-betting" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="360" rx="24" fill="url(#bg-betting)"/>
  <circle cx="680" cy="180" r="130" fill="#F59E0B" opacity="0.2" filter="url(#glow-betting)"/>
  <circle cx="120" cy="120" r="90" fill="#10B981" opacity="0.25" filter="url(#glow-betting)"/>

  <g transform="translate(48, 48)">
    <rect width="180" height="32" rx="16" fill="url(#gold-btn)"/>
    <text x="90" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#000000" text-anchor="middle" letter-spacing="0.5">INSTANT BET FUNDING</text>

    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">Zero-Fee Sportsbook</text>
    <text x="0" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#FCD34D">SportyBet &bull; Bet9ja &bull; 1xBet &bull; iLOT</text>

    <g transform="translate(0, 140)">
      <rect width="360" height="56" rx="14" fill="#0B1324" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">Fund Wallet from </text>
      <text x="160" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#10B981">₦100 FLAT</text>
      <rect x="260" y="14" width="85" height="26" rx="8" fill="rgba(16, 185, 129, 0.2)"/>
      <text x="302" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#10B981" text-anchor="middle">ZERO FEE</text>
    </g>

    <g transform="translate(0, 214)">
      <rect width="210" height="46" rx="23" fill="url(#gold-btn)"/>
      <text x="105" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#000000" text-anchor="middle">Fund Account &rarr;</text>
    </g>
  </g>

  <!-- Right Graphic: 3D Soccer Ball & Coins -->
  <g transform="translate(560, 60)">
    <circle cx="100" cy="120" r="75" fill="#FFFFFF"/>
    <!-- Soccer Pentagons -->
    <polygon points="100,75 118,88 111,109 89,109 82,88" fill="#111827"/>
    <polygon points="70,125 82,109 89,109 78,135 62,130" fill="#111827"/>
    <polygon points="130,125 118,109 111,109 122,135 138,130" fill="#111827"/>
    <polygon points="100,165 85,150 90,135 110,135 115,150" fill="#111827"/>
    
    <!-- Laurel Halo -->
    <circle cx="100" cy="120" r="95" fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="10 6"/>
  </g>
</svg>