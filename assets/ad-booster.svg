<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <linearGradient id="bg-booster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A044E"/>
      <stop offset="50%" stop-color="#2E0854"/>
      <stop offset="100%" stop-color="#0F031E"/>
    </linearGradient>
    <linearGradient id="pink-btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="badge-flame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
    <filter id="glow-booster" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="360" rx="24" fill="url(#bg-booster)"/>
  <circle cx="680" cy="160" r="140" fill="#EC4899" opacity="0.3" filter="url(#glow-booster)"/>
  <circle cx="140" cy="140" r="100" fill="#8B5CF6" opacity="0.25" filter="url(#glow-booster)"/>

  <g transform="translate(48, 48)">
    <rect width="190" height="32" rx="16" fill="url(#badge-flame)"/>
    <text x="95" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">SOCIAL MEDIA BOOSTER</text>

    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">Instant Account Growth</text>
    <text x="0" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#F472B6">Instagram &#8226; TikTok &#8226; YouTube &#8226; X</text>

    <g transform="translate(0, 140)">
      <rect width="360" height="56" rx="14" fill="#1C092E" stroke="#EC4899" stroke-width="1.5"/>
      <text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">1,000 Real Followers @ </text>
      <text x="195" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#F472B6">₦1,200</text>
      <rect x="275" y="14" width="70" height="26" rx="8" fill="rgba(244, 114, 182, 0.2)"/>
      <text x="310" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#F472B6" text-anchor="middle">BOOST</text>
    </g>

    <g transform="translate(0, 214)">
      <rect width="210" height="46" rx="23" fill="url(#pink-btn)"/>
      <text x="105" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">Boost Account &#8594;</text>
    </g>
  </g>

  <!-- Right Graphic: 3D Rocket & Growth Ring -->
  <g transform="translate(560, 60)">
    <circle cx="100" cy="120" r="100" fill="none" stroke="#EC4899" stroke-width="2" stroke-dasharray="8 6" opacity="0.4"/>
    <circle cx="100" cy="120" r="75" fill="none" stroke="#F472B6" stroke-width="2" opacity="0.6"/>
    
    <!-- Rocket Body -->
    <path d="M100 40 C120 70 125 120 120 150 L80 150 C75 120 80 70 100 40 Z" fill="#FFFFFF" stroke="#EC4899" stroke-width="3"/>
    <!-- Rocket Window -->
    <circle cx="100" cy="90" r="16" fill="#0F031E" stroke="#EC4899" stroke-width="3"/>
    <circle cx="100" cy="90" r="8" fill="#38BDF8"/>
    <!-- Rocket Fins -->
    <path d="M78 120 L55 155 L80 150 Z" fill="#F43F5E"/>
    <path d="M122 120 L145 155 L120 150 Z" fill="#F43F5E"/>
    <!-- Rocket Flame -->
    <polygon points="90,152 100,195 110,152" fill="#F59E0B" filter="url(#glow-booster)"/>
    <polygon points="94,152 100,180 106,152" fill="#FEF08A"/>
    
    <!-- Floating Badges -->
    <g transform="translate(10, 50)">
      <circle cx="15" cy="15" r="15" fill="#E1306C" filter="url(#glow-booster)"/>
      <text x="15" y="20" font-family="sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">&#9829;</text>
    </g>
    <g transform="translate(130, 80)">
      <circle cx="15" cy="15" r="15" fill="#1DA1F2" filter="url(#glow-booster)"/>
      <text x="15" y="20" font-family="sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">&#9733;</text>
    </g>
  </g>
</svg>