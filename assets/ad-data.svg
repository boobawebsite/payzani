<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <linearGradient id="bg-data" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="cyan-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="tag-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="glow-data" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="360" rx="24" fill="url(#bg-data)"/>
  <circle cx="680" cy="180" r="140" fill="#06B6D4" opacity="0.25" filter="url(#glow-data)"/>
  <circle cx="160" cy="100" r="100" fill="#7C3AED" opacity="0.3" filter="url(#glow-data)"/>

  <g transform="translate(48, 48)">
    <rect width="170" height="32" rx="16" fill="url(#tag-blue)"/>
    <text x="85" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">HOT DATA PLANS</text>

    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">Ultra-Fast 5G SME Data</text>
    <text x="0" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#93C5FD">Daily &#8226; Weekly &#8226; Monthly Bundles</text>

    <g transform="translate(0, 140)">
      <rect width="360" height="56" rx="14" fill="#0B132B" stroke="#1D4ED8" stroke-width="1.5"/>
      <text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">1GB 30-Day Data @ </text>
      <text x="180" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#38BDF8">₦280 ONLY</text>
      <rect x="285" y="14" width="60" height="26" rx="8" fill="rgba(56, 189, 248, 0.2)"/>
      <text x="315" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#38BDF8" text-anchor="middle">BEST</text>
    </g>

    <g transform="translate(0, 214)">
      <rect width="210" height="46" rx="23" fill="url(#cyan-purple)"/>
      <text x="105" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">Buy Data Plans &#8594;</text>
    </g>
  </g>

  <!-- Right Graphic: 5G Speed Orb & Wave -->
  <g transform="translate(560, 60)">
    <circle cx="100" cy="120" r="90" fill="#0B132B" stroke="#06B6D4" stroke-width="3"/>
    <circle cx="100" cy="120" r="70" fill="url(#cyan-purple)" opacity="0.3"/>
    
    <!-- 5G Badge -->
    <text x="100" y="115" font-family="sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" text-anchor="middle">5G</text>
    <text x="100" y="142" font-family="sans-serif" font-size="12" font-weight="800" fill="#38BDF8" text-anchor="middle" letter-spacing="1">INSTANT</text>
    
    <!-- Speed arcs -->
    <path d="M50 120 A50 50 0 0 1 150 120" fill="none" stroke="#06B6D4" stroke-width="5" stroke-linecap="round"/>
    <path d="M65 120 A35 35 0 0 1 135 120" fill="none" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>